
name: BUSTRIPPROJECT

services:
  postgres-db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: exam_2400031968
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bustrip-network

  bustrip-backend:
    image: sravanthi2580/bustrip-backend:latest
    container_name: bustrip-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/exam_2400031968
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - postgres-db
    networks:
      - bustrip-network

volumes:
  postgres-data:

networks:
  bustrip-network:
    driver: bridge
